spring.application.name=whatnext

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


biletix.api.url=https://api.biletix.com/v1
biletix.api.key=your-api-key-here

biletinial.api.url=https://api.biletinial.com/v1
biletinial.api.key=your-api-key-here
biletinial.city=istanbul

passo.api.url=https://api.passo.com.tr/v1
passo.api.key=your-api-key-here

apify.api.url=https://api.apify.com
apify.api.key=${APIFY_API_KEY:your-api-key-here}
apify.actor.id=your-biletix-crawler-actor-id

# Instagram Graph API Configuration — FACEBOOK_TOKEN yoksa boş kalır (crash yerine): InstagramService
# zaten null/boş token'ı @PostConstruct'ta ele alıyor, paylaşım denemesi o zaman düzgün hata verir.
instagram.access.token=${FACEBOOK_TOKEN:}
instagram.user.id=17841475581232957

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Biletix Scraper
biletix.chrome.path=/usr/local/chrome-linux64/chrome
biletix.wait.timeout=60
biletix.load.more.attempts=20
biletix.load.more.wait=2000

# Biletino Scraper
biletino.chrome.path=/usr/local/chrome-linux64/chrome
biletino.wait.timeout=60
biletino.scroll.attempts=20
biletino.scroll.wait=2000

# Biletinial Scraper
biletinial.chrome.path=/usr/local/chrome-linux64/chrome
biletinial.wait.timeout=60
biletinial.scroll.attempts=20
biletinial.scroll.wait=2000

whatnext.video.project-path=${WHATNEXT_VIDEO_PROJECT_PATH:-/app/video}
whatnext.video.chrome-path=/usr/local/chrome-headless-shell-linux64/chrome-headless-shell

# Konteyner portu: Dockerfile EXPOSE 8080 ile hizalı (yerelde application.properties 8086 kalır).
server.port=${PORT:8080}

# Cron görevleri (scraping + Instagram paylaşımı). İlk deploy/testte false verin;
# manuel /api/instagram/** uçları yine çalışır.
whatnext.scheduler.enabled=${SCHEDULER_ENABLED:true}
