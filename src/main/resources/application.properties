spring.application.name=whatnext

# Scraper (SLF4J) ve yardımcı sınıflar
logging.level.com.asaf.whatnext.utils=INFO
logging.level.com.asaf.whatnext.scraper=INFO
logging.level.com.asaf.whatnext.scraper.web=INFO

# PostgreSQL Database Configuration — gerçek değerler ortam değişkeninden gelir (bkz. README),
# git'e commit edilmez. Değişken yoksa local H2 profiline düşün: -Dspring-boot.run.profiles=local
spring.datasource.url=${LOCAL_DB_URL:jdbc:h2:file:./data/whatnext-local;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${LOCAL_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${LOCAL_DB_USER:sa}
spring.datasource.password=${LOCAL_DB_PASSWORD:}
spring.datasource.driver-class-name=${LOCAL_DB_DRIVER:org.h2.Driver}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# H2 Console Configuration (Development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Biletix API Configuration
biletix.api.url=https://api.biletix.com/v1
biletix.api.key=your-api-key-here

# Biletinial API Configuration
biletinial.api.url=https://api.biletinial.com/v1
biletinial.api.key=your-api-key-here
biletinial.city=istanbul

# Passo API Configuration
passo.api.url=https://api.passo.com.tr/v1
passo.api.key=your-api-key-here

# Apify Configuration
apify.api.url=https://api.apify.com
apify.api.key=${APIFY_API_KEY:your-api-key-here}
apify.actor.id=your-biletix-crawler-actor-id

# Instagram Graph API Configuration — gerçek token FACEBOOK_TOKEN ortam değişkeninden gelir, git'e
# commit edilmez (InstagramService @PostConstruct'ta boşsa System.getenv("FACEBOOK_TOKEN") ile de dener).
instagram.access.token=${FACEBOOK_TOKEN:}
instagram.user.id=17841475581232957

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Biletino Scraper
# Liste kartındaki mekân alanı ilçe adı (ör. "Kadıköy"); gerçek mekân adı detay sayfası title'ından
# düz HTTP GET ile zenginleştirilir (canlı denetimde doğrulandı, 2026-07-11). Ağ hatasında mevcut değer korunur.
biletino.enrich-venue-from-detail=true

bubilet.enrich-missing-venue-from-detail=true
bubilet.list-date.rollover-days=30
bubilet.biletler-date.rollover-days=60
bubilet.draft.progress-log-every=25

# Scrape sağlığı: tüm kaynaklar için ortak eşik (GET /api/scraper/health). Bubilet kendi anahtarıyla
# override edebilir (bubilet.scrape-health.min-parse-ratio), yoksa buna düşer.
whatnext.scrape-health.min-parse-ratio=0.8

# Kayıt anında akıllı tekilleştirme (EventIdentity)
whatnext.dedup.title-jaccard=0.5
whatnext.dedup.title-jaccard-strong=0.85

# Şablon otomasyonu (Faz 4). Varsayılan "static" = bugünkü davranış birebir, sıfır maliyet.
# "generated" = parametrik Java2D üretici (yine ücretsiz, dış API'ye bağımlı değil).
# "ai" = whatnext.templates.ai.api-key gerektirir (kendi Gemini anahtarınız) — anahtar yoksa/hata
# verirse otomatik "generated"e (workdir) değilse static'e düşer.
whatnext.templates.mode=static
whatnext.templates.workdir=generated-templates
whatnext.templates.ai.provider=gemini
whatnext.templates.ai.api-key=
whatnext.templates.ai.model=gemini-2.0-flash-preview-image-generation

# Görsel üretim motoru (Faz 5, Plan 2) — whatnext.templates.mode'dan FARKLI bir bayrak, karıştırmayın:
# templates.mode yalnızca "custom" motorunun kendi şablon kaynağını seçer (static/generated/ai PNG).
# Varsayılan "custom" = bugünkü ImageMagick+şablon davranışı birebir, sıfır risk.
# "remotion" = npx remotion still (React/CSS layout, video/src/stills/) — metin sığmama riski yok.
# "ai" = Gemini yalnızca ARKA PLAN üretir (whatnext.templates.ai.* anahtarını kullanır), metni hep
# remotion basar; anahtar yoksa/hata verirse remotion'a, o da başarısız olursa custom'a düşer.
whatnext.images.engine=remotion
whatnext.images.ai.cache-dir=generated-backgrounds

# Biletinial Scraper
biletinial.scrape.date-range-days=14

# Farklı ortamlar için örnek: application-prod.properties dosyası oluşturun ve prod değerlerini oraya yazın.
# Örnek:

# Weekly Video (Remotion)
whatnext.video.project-path=video
# NPX tam yolu (IDE'den çalıştırırken PATH'te Node olmayabilir). Örn: C:\\Program Files\\nodejs\\npx.cmd
# whatnext.video.npx-command=C:\\Program Files\\nodejs\\npx.cmd
server.port=8086